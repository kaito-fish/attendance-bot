name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Check the PR author, not github.actor: a human reopening the PR becomes the actor.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Require alerts token
        env:
          ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          if [ -z "$ALERTS_TOKEN" ]; then
            echo "::error::DEPENDABOT_ALERTS_TOKEN secret is not set; cannot tell security updates apart."
            exit 1
          fi

      # alert-lookup needs a PAT: GITHUB_TOKEN cannot read Dependabot alerts.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          alert-lookup: true

      # The top-level ghsa-id output only reflects the first dependency, so check every one.
      - name: Check for security advisory
        id: security
        env:
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          echo "$DEPS_JSON" | jq -r '.[] | "\(.dependencyName): ghsa=\(.ghsaId // "")"'
          if echo "$DEPS_JSON" | jq -e 'any(.[]; (.ghsaId // "") != "")' > /dev/null; then
            echo "is-security=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-security=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge for security updates
        if: steps.security.outputs.is-security == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
