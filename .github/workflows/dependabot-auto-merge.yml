name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Check the PR author, not github.actor: a human reopening the PR becomes the actor.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Verifies the PR is genuinely from Dependabot (author + signed commit).
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      # Without dependabot.yml, Dependabot only opens PRs for security alerts,
      # so every Dependabot PR here is a security update. If version updates are
      # ever configured, stop auto-merging rather than merge them too.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          sparse-checkout: .github

      - name: Ensure version updates are not configured
        run: |
          if [ -f .github/dependabot.yml ] || [ -f .github/dependabot.yaml ]; then
            echo "::error::dependabot.yml exists, so Dependabot PRs may be regular version updates. Auto-merge disabled."
            exit 1
          fi

      - name: Enable auto-merge
        if: steps.metadata.outputs.dependency-names != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
